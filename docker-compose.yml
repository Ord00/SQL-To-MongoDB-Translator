services:
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  scanner:
    build:
      context: ./Scanner
      dockerfile: Dockerfile

    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  parser:
    build:
      context: ./Parser
      dockerfile: Dockerfile

    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  ir-generator:
    build:
      context: ./IRGenerator
      dockerfile: Dockerfile

    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  code-generator:
    build:
      context: ./CodeGenerator
      dockerfile: Dockerfile

    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod