spring:
  application:
    name: ApiGateway
  rabbitmq:
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    host: ${RABBIT_SERVICE:localhost}
    port: 5672

server:
  port: 8082

rabbitmq:
  request:
    queue:
      name: parser_queue
  response:
    success:
      queue:
        name: ir_generator_queue
    error:
      queue:
        name: result_queue